<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 32px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; fill: #64748b; }
      .label { font-family: Arial, sans-serif; font-size: 14px; fill: #1e293b; font-weight: 600; }
      .small-label { font-family: Arial, sans-serif; font-size: 12px; fill: #475569; }
      .tiny-label { font-family: Arial, sans-serif; font-size: 11px; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .docker-box { fill: #2496ed; stroke: #1d7fc7; stroke-width: 3; rx: 8; }
      .dag-box { fill: #017cee; stroke: #0159b5; stroke-width: 2; }
      .postgres-box { fill: #336791; stroke: #254b6f; stroke-width: 2; }
      .api-box { fill: #ff0000; stroke: #cc0000; stroke-width: 2; }
      .soda-box { fill: #6366f1; stroke: #4f46e5; stroke-width: 2; }
      .test-box { fill: #10b981; stroke: #059669; stroke-width: 2; }
      .cicd-box { fill: #f59e0b; stroke: #d97706; stroke-width: 2; }
      .json-box { fill: #f97316; stroke: #ea580c; stroke-width: 2; }
      .white-text { fill: #ffffff; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
      .thick-arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrowhead-thick); }
      .data-arrow { fill: none; stroke: #3b82f6; stroke-width: 2.5; marker-end: url(#arrowhead-blue); stroke-dasharray: 5,5; }
      .trigger-arrow { fill: none; stroke: #8b5cf6; stroke-width: 2.5; marker-end: url(#arrowhead-purple); stroke-dasharray: 8,4; }
    </style>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748b" />
    </marker>
    
    <marker id="arrowhead-thick" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#475569" />
    </marker>
    
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3b82f6" />
    </marker>
    
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#8b5cf6" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" class="title">YouTube ELT Pipeline Architecture</text>
  <text x="700" y="65" text-anchor="middle" class="subtitle">Docker • Airflow • PostgreSQL • Soda • GitHub Actions</text>
  
  <!-- Docker Container (Main) -->
  <rect class="docker-box" x="50" y="100" width="1300" height="700" />
  <text x="700" y="130" text-anchor="middle" class="white-text" style="font-size: 20px; font-weight: bold;">🐳 Docker Environment</text>
  
  <!-- YouTube API (External Source) -->
  <rect class="api-box" x="80" y="170" width="160" height="90" rx="8" />
  <text x="160" y="200" text-anchor="middle" class="white-text label">📺 YouTube API</text>
  <text x="160" y="220" text-anchor="middle" class="white-text small-label">Data Source</text>
  <text x="160" y="238" text-anchor="middle" class="white-text small-label">• Video Stats</text>
  <text x="160" y="252" text-anchor="middle" class="white-text small-label">• Channel Info</text>
  
  <!-- DAG 1: produce_json (Extract) -->
  <g id="dag1">
    <rect class="dag-box" x="280" y="170" width="360" height="280" rx="8" />
    <text x="460" y="200" text-anchor="middle" class="white-text label">🌪️ DAG 1: produce_json (Extract)</text>
    <text x="460" y="218" text-anchor="middle" class="white-text small-label">Schedule: Daily @ 08:00 UTC</text>
    
    <!-- Tasks -->
    <rect class="box" x="300" y="235" width="320" height="200" />
    
    <rect class="api-box" x="320" y="250" width="130" height="35" rx="4" opacity="0.9"/>
    <text x="385" y="271" text-anchor="middle" class="white-text tiny-label">get_playlist_id</text>
    
    <rect class="api-box" x="320" y="295" width="130" height="35" rx="4" opacity="0.9"/>
    <text x="385" y="316" text-anchor="middle" class="white-text tiny-label">get_video_ids</text>
    
    <rect class="api-box" x="320" y="340" width="130" height="35" rx="4" opacity="0.9"/>
    <text x="385" y="361" text-anchor="middle" class="white-text tiny-label">extract_video_data</text>
    
    <rect class="json-box" x="320" y="385" width="130" height="35" rx="4" opacity="0.9"/>
    <text x="385" y="406" text-anchor="middle" class="white-text tiny-label">save_to_json</text>
    
    <rect class="box" x="470" y="385" width="130" height="35" rx="4" style="fill: #8b5cf6; stroke: #7c3aed;"/>
    <text x="535" y="406" text-anchor="middle" class="white-text tiny-label">trigger_etl_warehouse</text>
    
    <!-- Task flow arrows within DAG -->
    <path class="arrow" d="M 385 285 L 385 295" />
    <path class="arrow" d="M 385 330 L 385 340" />
    <path class="arrow" d="M 385 375 L 385 385" />
    <path class="arrow" d="M 450 402 L 470 402" />
  </g>
  
  <!-- JSON Storage -->
  <g id="json-storage">
    <rect class="json-box" x="680" y="170" width="160" height="90" rx="8" />
    <text x="760" y="200" text-anchor="middle" class="white-text label">📁 JSON Files</text>
    <text x="760" y="220" text-anchor="middle" class="white-text small-label">/data/*.json</text>
    <text x="760" y="238" text-anchor="middle" class="white-text small-label">Daily Extracts</text>
    <text x="760" y="252" text-anchor="middle" class="white-text small-label">YT_data_YYYY-MM-DD</text>
  </g>
  
  <!-- DAG 2: etl_warehouse (Load & Transform) -->
  <g id="dag2">
    <rect class="dag-box" x="280" y="470" width="360" height="200" rx="8" />
    <text x="460" y="500" text-anchor="middle" class="white-text label">🌪️ DAG 2: etl_warehouse (Load & Transform)</text>
    <text x="460" y="518" text-anchor="middle" class="white-text small-label">Triggered by DAG 1</text>
    
    <!-- Tasks -->
    <rect class="box" x="300" y="535" width="320" height="120" />
    
    <rect class="postgres-box" x="320" y="550" width="130" height="35" rx="4" opacity="0.9"/>
    <text x="385" y="571" text-anchor="middle" class="white-text tiny-label">staging_table</text>
    
    <rect class="postgres-box" x="320" y="595" width="130" height="35" rx="4" opacity="0.9"/>
    <text x="385" y="616" text-anchor="middle" class="white-text tiny-label">core_table</text>
    
    <rect class="box" x="470" y="595" width="130" height="35" rx="4" style="fill: #8b5cf6; stroke: #7c3aed;"/>
    <text x="535" y="616" text-anchor="middle" class="white-text tiny-label">trigger_data_quality</text>
    
    <!-- Task flow arrows -->
    <path class="arrow" d="M 385 585 L 385 595" />
    <path class="arrow" d="M 450 612 L 470 612" />
  </g>
  
  <!-- DAG 3: data_quality (Quality Checks) -->
  <g id="dag3">
    <rect class="soda-box" x="680" y="470" width="360" height="200" rx="8" />
    <text x="860" y="500" text-anchor="middle" class="white-text label">🧪 DAG 3: data_quality (Quality Checks)</text>
    <text x="860" y="518" text-anchor="middle" class="white-text small-label">Schedule: Daily @ 10:00 UTC | Triggered by DAG 2</text>
    
    <!-- Tasks -->
    <rect class="box" x="700" y="535" width="320" height="120" />
    
    <rect class="soda-box" x="720" y="550" width="130" height="35" rx="4" opacity="0.9"/>
    <text x="785" y="571" text-anchor="middle" class="white-text tiny-label">soda_test_staging</text>
    
    <rect class="soda-box" x="720" y="595" width="130" height="35" rx="4" opacity="0.9"/>
    <text x="785" y="616" text-anchor="middle" class="white-text tiny-label">soda_test_core</text>
    
    <!-- Task flow arrows -->
    <path class="arrow" d="M 785 585 L 785 595" />
    
    <!-- Soda details -->
    <rect class="box" x="870" y="550" width="130" height="80" rx="4" style="fill: #ede9fe;"/>
    <text x="935" y="568" text-anchor="middle" class="small-label">Checks:</text>
    <text x="935" y="587" text-anchor="middle" class="tiny-label">• Completeness</text>
    <text x="935" y="602" text-anchor="middle" class="tiny-label">• Validity</text>
    <text x="935" y="617" text-anchor="middle" class="tiny-label">• Consistency</text>
  </g>
  
  <!-- PostgreSQL Database -->
  <g id="postgres">
    <rect class="postgres-box" x="1090" y="170" width="230" height="500" rx="8" />
    <text x="1205" y="200" text-anchor="middle" class="white-text label">🐘 PostgreSQL</text>
    <text x="1205" y="220" text-anchor="middle" class="white-text small-label">Data Warehouse</text>
    
    <!-- Staging Layer -->
    <rect class="box" x="1110" y="250" width="190" height="180" />
    <text x="1205" y="273" text-anchor="middle" class="label">Staging Layer</text>
    <text x="1205" y="290" text-anchor="middle" class="small-label">Raw Data from JSON</text>
    <line x1="1125" y1="300" x2="1285" y2="300" stroke="#cbd5e1" stroke-width="1"/>
    <text x="1205" y="320" text-anchor="middle" class="tiny-label">Tables:</text>
    <text x="1205" y="338" text-anchor="middle" class="tiny-label">• raw_videos</text>
    <text x="1205" y="354" text-anchor="middle" class="tiny-label">• raw_channels</text>
    <text x="1205" y="370" text-anchor="middle" class="tiny-label">• raw_statistics</text>
    <text x="1205" y="390" text-anchor="middle" class="tiny-label" style="fill: #6366f1;">✓ Quality Checks</text>
    <text x="1205" y="408" text-anchor="middle" class="tiny-label" style="fill: #6366f1;">via Soda</text>
    
    <!-- Core Layer -->
    <rect class="box" x="1110" y="450" width="190" height="200" />
    <text x="1205" y="473" text-anchor="middle" class="label">Core Layer</text>
    <text x="1205" y="490" text-anchor="middle" class="small-label">Transformed Data</text>
    <line x1="1125" y1="500" x2="1285" y2="500" stroke="#cbd5e1" stroke-width="1"/>
    <text x="1205" y="520" text-anchor="middle" class="tiny-label">Tables:</text>
    <text x="1205" y="538" text-anchor="middle" class="tiny-label">• cleaned_videos</text>
    <text x="1205" y="554" text-anchor="middle" class="tiny-label">• video_metrics</text>
    <text x="1205" y="570" text-anchor="middle" class="tiny-label">• channel_analytics</text>
    <text x="1205" y="586" text-anchor="middle" class="tiny-label">• aggregated_stats</text>
    <text x="1205" y="608" text-anchor="middle" class="tiny-label" style="fill: #6366f1;">✓ Quality Checks</text>
    <text x="1205" y="626" text-anchor="middle" class="tiny-label" style="fill: #6366f1;">via Soda</text>
  </g>
  
  <!-- Testing Container -->
  <g id="testing">
    <rect class="test-box" x="80" y="290" width="160" height="110" rx="8" />
    <text x="160" y="320" text-anchor="middle" class="white-text label">✅ Testing</text>
    <text x="160" y="338" text-anchor="middle" class="white-text small-label">pytest</text>
    <text x="160" y="358" text-anchor="middle" class="white-text small-label">• Unit Tests</text>
    <text x="160" y="374" text-anchor="middle" class="white-text small-label">• Integration Tests</text>
    <text x="160" y="390" text-anchor="middle" class="white-text small-label">• Coverage Reports</text>
  </g>
  
  <!-- Airflow Components -->
  <g id="airflow-meta">
    <rect class="box" x="80" y="490" width="160" height="110" rx="8" style="fill: #dbeafe; stroke: #3b82f6;"/>
    <text x="160" y="520" text-anchor="middle" class="label">⚙️ Airflow</text>
    <text x="160" y="538" text-anchor="middle" class="small-label">Components</text>
    <text x="160" y="558" text-anchor="middle" class="tiny-label">• Webserver (8080)</text>
    <text x="160" y="574" text-anchor="middle" class="tiny-label">• Scheduler</text>
    <text x="160" y="590" text-anchor="middle" class="tiny-label">• Executor</text>
  </g>
  
  <!-- CI/CD Pipeline (Bottom) -->
  <g id="cicd">
    <rect class="cicd-box" x="280" y="690" width="760" height="90" rx="8" />
    <text x="660" y="720" text-anchor="middle" class="white-text label">⚡ CI/CD Pipeline - GitHub Actions</text>
    
    <rect class="box" x="300" y="735" width="150" height="35" rx="4" />
    <text x="375" y="756" text-anchor="middle" class="small-label">Linting & Formatting</text>
    
    <rect class="box" x="470" y="735" width="150" height="35" rx="4" />
    <text x="545" y="756" text-anchor="middle" class="small-label">Unit Tests</text>
    
    <rect class="box" x="640" y="735" width="150" height="35" rx="4" />
    <text x="715" y="756" text-anchor="middle" class="small-label">Integration Tests</text>
    
    <rect class="box" x="810" y="735" width="150" height="35" rx="4" />
    <text x="885" y="756" text-anchor="middle" class="small-label">Docker Build</text>
    
    <rect class="box" x="980" y="735" width="150" height="35" rx="4" />
    <text x="1055" y="756" text-anchor="middle" class="small-label">Coverage Reports</text>
    
    <!-- CI/CD flow arrows -->
    <path class="arrow" d="M 450 752 L 470 752" />
    <path class="arrow" d="M 620 752 L 640 752" />
    <path class="arrow" d="M 790 752 L 810 752" />
    <path class="arrow" d="M 960 752 L 980 752" />
  </g>
  
  <!-- Data Flow Arrows -->
  <!-- API to DAG1 -->
  <path class="data-arrow" d="M 240 215 L 280 215" />
  
  <!-- DAG1 to JSON -->
  <path class="data-arrow" d="M 640 215 L 680 215" />
  
  <!-- JSON to DAG2 -->
  <path class="data-arrow" d="M 760 260 L 760 430 L 385 430 L 385 470" />
  
  <!-- DAG2 to PostgreSQL Staging -->
  <path class="data-arrow" d="M 640 567 L 1090 320" />
  
  <!-- Staging to Core in PostgreSQL -->
  <path class="data-arrow" d="M 1205 430 L 1205 450" />
  
  <!-- PostgreSQL to DAG3 for quality checks -->
  <path class="data-arrow" d="M 1090 320 L 1050 320 L 1050 567 L 1040 567 L 850 567" />
  <path class="data-arrow" d="M 1090 550 L 1050 550 L 1050 612 L 1040 612 L 850 612" />
  
  <!-- Trigger arrows between DAGs -->
  <path class="trigger-arrow" d="M 600 402 L 620 402 L 620 460 L 460 460 L 460 470" />
  <path class="trigger-arrow" d="M 600 612 L 620 612 L 620 690 L 860 690 L 860 670" />
  
  <!-- Testing to DAGs -->
  <path class="arrow" d="M 160 400 L 160 440 L 280 440 L 280 410" />
  
  <!-- Airflow components to DAGs -->
  <path class="arrow" d="M 240 545 L 280 545" />
  
  <!-- Legend -->
  <g id="legend" transform="translate(1090, 690)">
    <rect class="box" x="0" y="0" width="230" height="90" />
    <text x="115" y="20" text-anchor="middle" class="label">Legend</text>
    
    <line x1="15" y1="35" x2="55" y2="35" class="data-arrow" />
    <text x="65" y="40" class="tiny-label">Data Flow</text>
    
    <line x1="15" y1="50" x2="55" y2="50" class="trigger-arrow" />
    <text x="65" y="55" class="tiny-label">DAG Trigger</text>
    
    <line x1="15" y1="65" x2="55" y2="65" class="arrow" />
    <text x="65" y="70" class="tiny-label">Task/Component Flow</text>
  </g>
</svg>